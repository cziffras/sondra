[project]
name = "sondra"
version = "0.1.0"
description = "Complex-valued deep learning for semantic segmentation of PolSAR imagery (UNet & SegFormer)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "einops",
    "ipykernel>=7.3.0",
    "matplotlib",
    "numpy",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tensorboard",
    "torch",
    "torchcvnn==0.9.4",
    "torchinfo",
    "torchvision",
    "tqdm",
    "wandb",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# Silence false positives from incomplete third-party type stubs
# (torch / torchcvnn / seaborn describe several runtime-valid calls too strictly).
reportArgumentType = "none"
reportIndexIssue = "none"
reportAttributeAccessIssue = "none"
reportPrivateImportUsage = "none"
reportCallIssue = "none"
